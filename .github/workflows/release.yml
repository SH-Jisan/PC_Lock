name: Build and Publish Standalone Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup LLVM & Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '18.1.8'

      - name: Build UEFI Pre-boot Binary
        shell: cmd
        run: |
          cd uefi-preboot
          if not exist "bin" mkdir bin
          clang -target x86_64-unknown-windows -ffreestanding -fshort-wchar -mno-red-zone -nostdlib -Wl,-subsystem:efi_application -Wl,-entry:EfiMain -Iinclude -o bin\pc_lock_preboot.efi src\efi_main.c src\graphics.c src\network.c src\chainloader.c src\memory.c

      - name: Run Master Standalone Package Builder
        shell: cmd
        run: |
          echo. | build_all_standalone.bat

      - name: Create Release Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "release_package\*" -DestinationPath "PC_Lock_Standalone_Release.zip" -Force

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'latest-standalone' }}
          name: PC Security Standalone Release ${{ github.ref_name || 'Latest' }}
          draft: false
          prerelease: false
          files: |
            PC_Lock_Standalone_Release.zip
            release_package/DeployManager.exe
            release_package/PC.SecurityAgent.exe
            release_package/pc_lock_preboot.efi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
