<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PC Remote Security Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.3);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 36px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }

    .pulse-dot.offline {
      background: #94a3b8;
      box-shadow: none;
      animation: none;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .pc-selector-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pc-select {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      outline: none;
      cursor: pointer;
    }

    .pc-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pc-name { font-size: 17px; font-weight: 700; color: #fff; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge-online { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-offline { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    .lock-state-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .state-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .state-value { font-size: 22px; font-weight: 800; }
    .state-value.unlocked { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }
    .state-value.locked { color: var(--danger); text-shadow: 0 0 15px var(--danger-glow); }

    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-lock {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 25px var(--danger-glow);
    }
    .btn-lock:active { transform: scale(0.97); }

    .btn-unlock {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 8px 25px var(--success-glow);
    }
    .btn-unlock:active { transform: scale(0.97); }

    .bio-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 15, 25, 0.95);
      border-radius: 36px;
      backdrop-filter: blur(16px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 30px;
      z-index: 100;
    }

    .fp-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--primary);
      box-shadow: 0 0 30px var(--primary-glow);
    }

    .audit-log {
      max-height: 120px;
      overflow-y: auto;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="status-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="pulse-dot" id="serverPulse"></div>
        <span id="controllerTitle">TRUSTED CONTROLLER</span>
      </div>
      <button onclick="configureCloudServer()" style="background:none; border:none; color:var(--primary); font-size:12px; cursor:pointer;">⚙️ Server</button>
    </div>

    <!-- Live PC Selector -->
    <div class="pc-selector-box">
      <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Select Workstation:</div>
      <select id="pcSelector" class="pc-select" onchange="onTerminalSelect(this.value)">
        <option value="">Searching for online PCs...</option>
      </select>
    </div>

    <div class="pc-card">
      <div class="pc-header">
        <div>
          <div class="pc-name" id="pcNameDisplay">Workstation</div>
          <div style="font-size: 11px; color: var(--text-muted);" id="pcIdDisplay">ID: --</div>
        </div>
        <span class="badge badge-offline" id="pcOnlineBadge">⚪ OFFLINE</span>
      </div>

      <div class="lock-state-box">
        <span class="state-title">Remote Lock State</span>
        <div class="state-value unlocked" id="lockStateText">UNLOCKED</div>
      </div>
      
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono';">
        <span>Last Active: <strong id="lastActiveDisplay">--</strong></span>
        <span>PIN: <strong id="adminPinDisplay" style="color:#facc15;">998877</strong></span>
      </div>
    </div>

    <!-- Main Action Button -->
    <button class="action-btn btn-lock" id="actionBtn" onclick="onActionButtonClick()">
      <span>🔒 LOCK PC</span>
    </button>

    <!-- Security Audit Log -->
    <div class="pc-card" style="padding: 14px;">
      <div style="font-size: 11px; font-weight: 700; color: #fff; margin-bottom: 6px;">Live Telemetry & IndexedDB Keystore</div>
      <div class="audit-log" id="auditLog">
        <div class="log-item"><span>Initializing Secure Enclave...</span><span>OK</span></div>
      </div>
    </div>

    <!-- Biometric Authentication Modal -->
    <div class="bio-modal" id="bioModal">
      <div class="fp-icon">👆</div>
      <div style="text-align: center;">
        <h3 style="color:#fff; margin-bottom: 4px;">Biometric Verification</h3>
        <p style="font-size: 13px; color: var(--text-muted);">Touch fingerprint sensor or Face ID to unlock PC</p>
      </div>
      <button onclick="approveBiometrics()" style="background: var(--primary); border: none; padding: 12px 24px; border-radius: 12px; font-weight:700; color:#0f172a; cursor:pointer;">
        Authorize Unlock
      </button>
    </div>
  </div>

  <script>
    const DB_NAME = 'PCLockSecureKeystore';
    const DB_VERSION = 1;
    const STORE_NAME = 'hardware_keys';

    let RELAY_WS_URL = localStorage.getItem('pc_lock_server_url') || (window.location.protocol === 'https:' ? 'wss://' + window.location.host : 'ws://' + (window.location.hostname || 'localhost') + ':4000');
    let MOBILE_DEVICE_ID = '';

    let ws = null;
    let registeredPcs = [];
    let currentPcId = '';
    let isLocked = false;
    let privateCryptoKey = null;
    let publicCryptoKey = null;
    let cachedPublicKeyHex = '';

    // --- IndexedDB Secure Non-Extractable Key Storage Engine ---

    function openKeyDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadOrGenerateHardwareKeys() {
      const db = await openKeyDatabase();

      // Attempt to load existing persistent keys
      const existing = await new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get('master_controller_key');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });

      if (existing && existing.privateKey && existing.publicKey && existing.publicKeyHex) {
        privateCryptoKey = existing.privateKey;
        publicCryptoKey = existing.publicKey;
        cachedPublicKeyHex = existing.publicKeyHex;
        MOBILE_DEVICE_ID = existing.deviceId;
        addLog('Persistent Non-Extractable Key Loaded from IndexedDB', 'KEY_PERSIST');
        return;
      }

      // Generate New ECDSA P-256 Keypair
      addLog('Generating Non-Extractable ECDSA P-256 Keypair...', 'CRYPTO_GEN');
      
      MOBILE_DEVICE_ID = 'mob_' + Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => b.toString(16).padStart(2, '0')).join('');

      const keyPair = await window.crypto.subtle.generateKey(
        { name: "ECDSA", namedCurve: "P-256" },
        true, // Public key extractable for registration, private key will be stored directly as CryptoKey object
        ["sign", "verify"]
      );

      privateCryptoKey = keyPair.privateKey;
      publicCryptoKey = keyPair.publicKey;

      const exportedSpki = await window.crypto.subtle.exportKey("spki", keyPair.publicKey);
      cachedPublicKeyHex = Array.from(new Uint8Array(exportedSpki))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');

      // Store CryptoKey objects natively in IndexedDB (W3C Structured Clone Preserves Non-Extractability)
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put({
          id: 'master_controller_key',
          deviceId: MOBILE_DEVICE_ID,
          privateKey: privateCryptoKey,
          publicKey: publicCryptoKey,
          publicKeyHex: cachedPublicKeyHex,
          createdAt: new Date().toISOString()
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });

      addLog('Zero-Leakage Keys Saved in IndexedDB Secure Storage', 'KEY_SAVED');
    }

    function getApiBaseUrl() {
      let url = RELAY_WS_URL;
      if (url.startsWith('wss://')) return url.replace('wss://', 'https://');
      if (url.startsWith('ws://')) return url.replace('ws://', 'http://');
      return url;
    }

    function configureCloudServer() {
      let current = localStorage.getItem('pc_lock_server_url') || RELAY_WS_URL;
      let newUrl = prompt('Enter Cloud Relay URL (e.g., https://pc-lock-relay.onrender.com or ws://localhost:4000):', current);
      if (newUrl && newUrl.trim() !== '') {
        newUrl = newUrl.trim();
        if (newUrl.startsWith('https://')) newUrl = newUrl.replace('https://', 'wss://');
        else if (newUrl.startsWith('http://')) newUrl = newUrl.replace('http://', 'ws://');
        else if (!newUrl.startsWith('ws://') && !newUrl.startsWith('wss://')) newUrl = 'wss://' + newUrl;

        RELAY_WS_URL = newUrl;
        localStorage.setItem('pc_lock_server_url', RELAY_WS_URL);
        if (ws) ws.close();
        connectRelay();
        fetchPcList();
      }
    }

    async function fetchPcList() {
      try {
        const apiBase = getApiBaseUrl();
        const res = await fetch(`${apiBase}/api/devices/status`);
        if (res.ok) {
          const data = await res.json();
          registeredPcs = data.pcs || [];
          renderPcDropdown();
        }
      } catch (e) {
        addLog('Failed to fetch PC list: ' + e.message, 'WARN');
      }
    }

    function renderPcDropdown() {
      const select = document.getElementById('pcSelector');
      if (registeredPcs.length === 0) {
        select.innerHTML = '<option value="">No PCs connected yet (Run PC Agent)</option>';
        updateSelectedPcView(null);
        return;
      }

      select.innerHTML = registeredPcs.map(p => `
        <option value="${p.id}" ${p.id === currentPcId ? 'selected' : ''}>
          ${p.pc_number} - ${p.device_name} (${p.is_online ? '🟢 ONLINE' : '⚪ OFFLINE'})
        </option>
      `).join('');

      if (!currentPcId || !registeredPcs.find(p => p.id === currentPcId)) {
        currentPcId = registeredPcs[0].id;
      }
      const selected = registeredPcs.find(p => p.id === currentPcId);
      updateSelectedPcView(selected);
    }

    function onTerminalSelect(pcId) {
      currentPcId = pcId;
      const selected = registeredPcs.find(p => p.id === pcId);
      updateSelectedPcView(selected);
    }

    function updateSelectedPcView(pc) {
      if (!pc) {
        document.getElementById('pcNameDisplay').innerText = 'No PC Selected';
        document.getElementById('pcIdDisplay').innerText = 'Start PC Agent to connect';
        document.getElementById('pcOnlineBadge').className = 'badge badge-offline';
        document.getElementById('pcOnlineBadge').innerText = '⚪ OFFLINE';
        return;
      }

      document.getElementById('pcNameDisplay').innerText = `${pc.pc_number} (${pc.device_name})`;
      document.getElementById('pcIdDisplay').innerText = `ID: ${pc.id}`;
      document.getElementById('adminPinDisplay').innerText = pc.admin_pin || '998877';
      document.getElementById('lastActiveDisplay').innerText = pc.last_seen_at ? new Date(pc.last_seen_at).toLocaleTimeString() : (pc.is_online ? 'Live' : 'Never');

      const badge = document.getElementById('pcOnlineBadge');
      if (pc.is_online) {
        badge.className = 'badge badge-online';
        badge.innerText = '🟢 ONLINE';
      } else {
        badge.className = 'badge badge-offline';
        badge.innerText = '⚪ OFFLINE';
      }

      updateLockUI(pc.lock_status === 'LOCKED');
    }

    function connectRelay() {
      try {
        ws = new WebSocket(`${RELAY_WS_URL}?device_id=${MOBILE_DEVICE_ID}&device_type=MOBILE`);
      } catch (e) {
        return;
      }

      ws.onopen = () => {
        addLog('Relay Gateway Connected', 'ONLINE');
        document.getElementById('serverPulse').className = 'pulse-dot';
        fetchPcList();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          
          if (data.event === 'PC_CONNECTION_STATE') {
            const pc = registeredPcs.find(p => p.id === data.pc_id);
            if (pc) {
              pc.is_online = data.is_online;
              pc.last_seen_at = data.last_seen_at;
            } else {
              fetchPcList();
            }
            renderPcDropdown();
            addLog(`PC ${data.pc_id} is now ${data.is_online ? 'ONLINE' : 'OFFLINE'}`, 'STATUS');
          } else if (data.event === 'PC_STATUS_UPDATED') {
            const pc = registeredPcs.find(p => p.id === data.pc_id);
            if (pc) pc.lock_status = data.lock_status;
            if (currentPcId === data.pc_id) {
              updateLockUI(data.lock_status === 'LOCKED');
            }
            addLog(`PC ${data.pc_id} Lock State: ${data.lock_status}`, 'EVENT');
          } else if (data.event === 'PC_DEREGISTERED') {
            registeredPcs = registeredPcs.filter(p => p.id !== data.pc_id);
            if (currentPcId === data.pc_id) currentPcId = '';
            renderPcDropdown();
            addLog(PC  + data.pc_id +  Uninstalled & Removed from Supabase Database, 'UNINSTALLED');
          } else if (data.status === 'REJECTED') {
            addLog(`Rejected: ${data.message}`, 'ERROR');
            alert('Security Error: ' + data.message);
          } else if (data.status === 'OFFLINE') {
            addLog(data.message, 'OFFLINE');
            alert(data.message);
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        document.getElementById('serverPulse').className = 'pulse-dot offline';
        setTimeout(connectRelay, 3000);
      };
    }

    async function sendSignedCommand(action) {
      if (!currentPcId) {
        alert('No PC connected. Please start the PC Security Agent first.');
        return;
      }

      if (!privateCryptoKey) {
        await loadOrGenerateHardwareKeys();
      }

      const version = "1.0";
      const commandId = crypto.randomUUID ? crypto.randomUUID() : ('cmd_' + Date.now());
      const timestamp = Math.floor(Date.now() / 1000);
      const nonce = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join('');

      // Construct Canonical String
      const canonicalData = `${version}:${commandId}:${MOBILE_DEVICE_ID}:${currentPcId}:${action}:${timestamp}:${nonce}`;
      
      // Hardware-gated WebCrypto Digital Signing
      const encoder = new TextEncoder();
      const signatureBuf = await window.crypto.subtle.sign(
        { name: "ECDSA", hash: { name: "SHA-256" } },
        privateCryptoKey,
        encoder.encode(canonicalData)
      );

      const signatureHex = Array.from(new Uint8Array(signatureBuf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');

      const payload = {
        version: version,
        command_id: commandId,
        sender_device_id: MOBILE_DEVICE_ID,
        target_pc_id: currentPcId,
        action: action,
        timestamp: timestamp,
        nonce: nonce,
        signature: signatureHex,
        public_key: cachedPublicKeyHex
      };

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
        addLog(`Dispatched Signed ${action} -> ${currentPcId}`, 'SENT');
      } else {
        addLog('Failed: WebSocket Offline', 'ERROR');
      }
    }

    function onActionButtonClick() {
      if (!isLocked) {
        sendSignedCommand('LOCK_PC');
        updateLockUI(true);
      } else {
        if (window.AndroidBiometric && window.AndroidBiometric.triggerBiometricAuth) {
          window.AndroidBiometric.triggerBiometricAuth();
        } else {
          document.getElementById('bioModal').style.display = 'flex';
        }
      }
    }

    function approveBiometrics() {
      document.getElementById('bioModal').style.display = 'none';
      sendSignedCommand('UNLOCK_PC');
      updateLockUI(false);
      addLog('Biometrics Authorization Approved', 'AUTH_OK');
    }

    function updateLockUI(locked) {
      isLocked = locked;
      const textEl = document.getElementById('lockStateText');
      const btn = document.getElementById('actionBtn');

      if (locked) {
        textEl.className = 'state-value locked';
        textEl.innerText = 'LOCKED';
        btn.className = 'action-btn btn-unlock';
        btn.innerHTML = '<span>🔓 UNLOCK PC</span>';
      } else {
        textEl.className = 'state-value unlocked';
        textEl.innerText = 'UNLOCKED';
        btn.className = 'action-btn btn-lock';
        btn.innerHTML = '<span>🔒 LOCK PC</span>';
      }
    }

    function addLog(msg, type) {
      const logBox = document.getElementById('auditLog');
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<span>${msg}</span><span>${time}</span>`;
      logBox.prepend(item);
    }

    loadOrGenerateHardwareKeys().then(() => {
      fetchPcList();
      connectRelay();
    });
    setInterval(fetchPcList, 8000);
  </script>
</body>
</html>
