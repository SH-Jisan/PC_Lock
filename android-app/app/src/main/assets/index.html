<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PC Remote Security Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="phone-container">
    <div class="status-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="pulse-dot" id="serverPulse"></div>
        <span id="controllerTitle">TRUSTED CONTROLLER</span>
      </div>
      <button onclick="configureCloudServer()" style="background:none; border:none; color:var(--primary); font-size:12px; cursor:pointer;">⚙️ Server</button>
    </div>

    <!-- Live PC Selector -->
    <div class="pc-selector-box">
      <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Select Workstation:</div>
      <select id="pcSelector" class="pc-select" onchange="onTerminalSelect(this.value)">
        <option value="">Searching for online PCs...</option>
      </select>
    </div>

    <div class="pc-card">
      <div class="pc-header">
        <div>
          <div class="pc-name" id="pcNameDisplay">Workstation</div>
          <div style="font-size: 11px; color: var(--text-muted);" id="pcIdDisplay">ID: --</div>
        </div>
        <span class="badge badge-offline" id="pcOnlineBadge">⚪ OFFLINE</span>
      </div>

      <div class="lock-state-box">
        <span class="state-title">Remote Lock State</span>
        <div class="state-value unlocked" id="lockStateText">UNLOCKED</div>
      </div>
      
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono';">
        <span>Last Active: <strong id="lastActiveDisplay">--</strong></span>
        <span>PIN: <strong id="adminPinDisplay" style="color:#facc15;">998877</strong></span>
      </div>
    </div>

    <!-- Main Action Button -->
    <button class="action-btn btn-lock" id="actionBtn" onclick="onActionButtonClick()">
      <span>🔒 LOCK PC</span>
    </button>

    <!-- Security Audit Log -->
    <div class="pc-card" style="padding: 14px;">
      <div style="font-size: 11px; font-weight: 700; color: #fff; margin-bottom: 6px;">Live Telemetry & IndexedDB Keystore</div>
      <div class="audit-log" id="auditLog">
        <div class="log-item"><span>Initializing Secure Enclave...</span><span>OK</span></div>
      </div>
    </div>

    <!-- Biometric Authentication Modal -->
    <div class="bio-modal" id="bioModal">
      <div class="fp-icon">👆</div>
      <div style="text-align: center;">
        <h3 style="color:#fff; margin-bottom: 4px;">Biometric Verification</h3>
        <p style="font-size: 13px; color: var(--text-muted);">Touch fingerprint sensor or Face ID to unlock PC</p>
      </div>
      <button onclick="approveBiometrics()" style="background: var(--primary); border: none; padding: 12px 24px; border-radius: 12px; font-weight:700; color:#0f172a; cursor:pointer;">
        Authorize Unlock
      </button>
    </div>
  </div>

  <script src="js/crypto.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
